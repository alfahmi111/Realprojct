<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="وِثاق"><style>@media (prefers-color-scheme: dark){g{stroke:#F3E9E1}}</style>
  <!--
    وِثاق — the mark: two chain links that lean together into one roof.
    The link is the bond (وثاق) between owner, manager and tenant; the roof is the property.
    The links are truly interlaced: at the apex the left link passes over, inside the roof the right link passes over.
    Single colour (currentColor): it follows every theme, light and dark.
  -->
  <defs>
    <path id="w-link" d="M -13 -32 A 13 13 0 0 1 13 -32 L 13 32 A 13 13 0 0 1 -13 32 Z"/>
    <!-- Inside the roof: the right link's inner edge passes over the left link. -->
    <mask id="w-mask-left" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <path d="M -13 -16 L -13 30" transform="translate(79 68) rotate(-24)" stroke="#000" stroke-width="19" fill="none"/>
    </mask>
    <!-- At the apex: the left link's cap passes over the right link. -->
    <mask id="w-mask-right" maskUnits="userSpaceOnUse" x="0" y="0" width="120" height="120">
      <rect width="120" height="120" fill="#fff"/>
      <path d="M -13 -32 A 13 13 0 0 1 13 -32" transform="translate(41 68) rotate(24)" stroke="#000" stroke-width="19" fill="none"/>
    </mask>
  </defs>
  <g fill="none" stroke="#2A1E17" stroke-width="9">
    <g mask="url(#w-mask-left)"><use href="#w-link" transform="translate(41 68) rotate(24)"/></g>
    <g mask="url(#w-mask-right)"><use href="#w-link" transform="translate(79 68) rotate(-24)"/></g>
  </g>
</svg>
